name: Format Rust launch integration (temporary)

on:
  push:
    branches:
      - feat/vscode-launch-tasks-portable
    paths:
      - .github/workflows/rust-launch-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Format Rust and TypeScript
        run: |
          cargo fmt --all
          pnpm exec oxfmt src/features/debugger/launch.ts src/features/debugger/__tests__/launch.test.ts docs/vscode-launch-tasks.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ide-run/src/import/vscode_profiles.rs crates/ide-run/tests/import_vscode_profiles.rs src/features/debugger/launch.ts src/features/debugger/__tests__/launch.test.ts docs/vscode-launch-tasks.md
          if ! git diff --staged --quiet; then
            git -c core.hooksPath=/dev/null commit -m "style: format Rust CodeLLDB integration"
            git push origin HEAD:feat/vscode-launch-tasks-portable
          fi
